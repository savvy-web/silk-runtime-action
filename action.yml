name: Setup JavaScript Runtime Environment
description: Comprehensive JavaScript runtime setup (Node.js, Bun, Deno) configured via package.json devEngines.runtime, with dependency caching, Turbo build cache, and optional Biome linter configuration
branding:
  icon: package
  color: green
inputs:
  biome-version:
    description: Biome version to install (e.g., '2.3.14'). If not provided, auto-detects from biome.jsonc/biome.json $schema field. Leave empty to skip.
    required: false
    default: ""
  turbo-cache:
    description: Turbo remote cache mode (auto | off). auto starts an embedded cache server when turbo.json is present and no external Vercel creds are set.
    required: false
    default: "auto"
  turbo-cache-prefix:
    description: Key prefix/namespace for embedded turbo cache artifacts.
    required: false
    default: ""
  turbo-token:
    description: Turbo remote cache token (selects passthrough/external Vercel mode and disables the embedded server).
    required: false
    default: ""
  turbo-team:
    description: Turbo team slug (selects passthrough/external Vercel mode and disables the embedded server).
    required: false
    default: ""
  turbo-s3-bucket:
    description: S3 bucket for the embedded turbo cache backend. Presence selects the S3 backend.
    required: false
    default: ""
  turbo-s3-region:
    description: S3 region for the embedded turbo cache backend.
    required: false
    default: ""
  turbo-s3-endpoint:
    description: Custom S3 endpoint (R2/MinIO/Spaces). Leave empty for AWS S3.
    required: false
    default: ""
  turbo-s3-access-key-id:
    description: S3 access key id for the embedded turbo cache backend.
    required: false
    default: ""
  turbo-s3-secret-access-key:
    description: S3 secret access key for the embedded turbo cache backend.
    required: false
    default: ""
  turbo-s3-session-token:
    description: Optional S3 session token for temporary credentials.
    required: false
    default: ""
  turbo-s3-prefix:
    description: Optional key prefix within the S3 bucket.
    required: false
    default: ""
  install-deps:
    description: Whether to install dependencies (true | false). Set to false to skip dependency installation.
    required: false
    default: "true"
  ignore-scripts:
    description: Skip dependency lifecycle scripts during the install (true | false). Passes --ignore-scripts to npm/pnpm/bun and --mode=skip-build to yarn Berry. No effect when install-deps is false, or for deno.
    required: false
    default: "false"
  bats:
    description: Provision the BATS toolchain — bats-core, bats-support, bats-assert, bats-file, bats-mock (auto | true | false). auto installs when a *.bats file or a vitest-bats dependency is present.
    required: false
    default: "auto"
  kcov:
    description: Provision kcov for shell-script coverage (auto | true | false). auto follows the bats decision. Built from source and cached; never installed when bats is off.
    required: false
    default: "auto"
  cache-bust:
    description: Cache busting string appended to cache key. Use a unique value (e.g., run ID) to force cache miss. 'false' disables. Only use for testing!
    required: false
    default: "false"
  additional-lockfiles:
    description: Additional lockfile patterns to include in cache key generation. Supports glob patterns. One pattern per line (e.g., 'deno.lock', '**/yarn.lock').
    required: false
    default: ""
  additional-cache-paths:
    description: Additional paths to cache/restore. Multiline string with glob patterns (e.g., '**/build', '**/dist').
    required: false
    default: ""
outputs:
  node-version:
    description: The Node.js version that was installed (e.g., '24.10.0' or empty if not installed)
  node-enabled:
    description: Whether Node.js was installed (true | false)
  bun-version:
    description: The Bun version that was installed (e.g., '1.3.3' or empty if not installed)
  bun-enabled:
    description: Whether Bun was installed (true | false)
  deno-version:
    description: The Deno version that was installed (e.g., '2.5.6' or empty if not installed)
  deno-enabled:
    description: Whether Deno was installed (true | false)
  package-manager:
    description: The package manager name (npm | pnpm | yarn | bun | deno)
  package-manager-version:
    description: The package manager version (e.g., '10.20.0')
  biome-version:
    description: The Biome version that was installed (e.g., '2.3.14' or empty if not installed)
  biome-enabled:
    description: Whether Biome was installed (true | false)
  bats-enabled:
    description: Whether the BATS toolchain was installed (true | false)
  bats-version:
    description: The bats-core version that was installed (e.g. '1.14.0' or empty if not installed)
  bats-lib-path:
    description: The BATS_LIB_PATH value that was exported (or empty if bats was not installed)
  kcov-enabled:
    description: Whether kcov was installed (true | false)
  kcov-version:
    description: The kcov version that was installed (e.g. '43' or empty if not installed)
  kcov-cache-hit:
    description: Whether kcov was restored from the Actions cache rather than built (true | false)
  turbo-enabled:
    description: Whether Turbo configuration was detected (true | false)
  turbo-cache-backend:
    description: Active turbo cache backend (github | s3 | remote | none)
  turbo-cache-port:
    description: Local port the embedded turbo cache server bound to (empty when not started)
  cache-hit:
    description: Whether dependencies were restored from cache (true | partial | false)
  store-cache-hit:
    description: Whether the package manager's global store was restored from cache (true | partial | false). Keyed independently of cache-hit.
  lockfiles:
    description: Comma-separated list of detected lockfiles used for cache key generation (e.g., 'pnpm-lock.yaml,deno.lock')
  cache-paths:
    description: Comma-separated list of cache paths being cached/restored (e.g., '/home/runner/.cache/deno,**/node_modules')
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
