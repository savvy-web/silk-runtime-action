name: Test Turbo Cache
on:
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: the jobs only checkout and run the local action;
# the embedded server uses ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN. One job,
# `hosted-double-build`, raises this to add `id-token: write` for itself alone.
permissions:
  contents: read

jobs:
  # Job 1: within-job remote round-trip (proves the server mechanism).
  double-build:
    name: Within-job double build (GitHub backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __fixtures__/turbo-monorepo
    steps:
      - uses: actions/checkout@v7
      # `install-deps: false` because a `uses:` step does not honour
      # `defaults.run.working-directory` — the action always executes at
      # GITHUB_WORKSPACE. Left on, its install step would install the *action
      # repo's* dependencies, which is never what this workflow wanted; the
      # fixture is installed by its own `run:` step below, which does honour the
      # default. Turbo detection and the cache server are unaffected.
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          install-deps: "false"
      # The greps below prove turbo got a cache; this proves the *action* said
      # which one and where. Values go through `env` rather than being
      # interpolated into the script, so the assertion cannot become an
      # injection if an output ever carries something unexpected.
      - name: Assert the reported backend and port
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "github" ] || { echo "Expected backend 'github', got '$BACKEND'"; exit 1; }
          [ "$PORT" = "41230" ] || { echo "Expected port '41230', got '$PORT'"; exit 1; }
      # A `run:` step *does* honour the working-directory default, so this is
      # the fixture's own install — its pnpm-workspace.yaml makes it a workspace
      # root, so pnpm stops there and never sees the repo root's overrides. The
      # action has already put node and pnpm on PATH via GITHUB_PATH.
      - name: Install fixture dependencies
        run: pnpm install --frozen-lockfile
      - name: First build (populates remote cache)
        run: pnpm exec turbo run build --remote-only
      - name: Clear local turbo state
        run: rm -rf .turbo packages/app/.turbo node_modules/.cache/turbo
      - name: Second build (must be a remote cache hit)
        run: |
          OUT=$(pnpm exec turbo run build --remote-only)
          echo "$OUT"
          echo "$OUT" | grep -E ">>> FULL TURBO|cache hit" || { echo "Expected a remote cache hit"; exit 1; }

  # Job 2: a SEPARATE job that depends on job 1 — this is the real requirement
  # (dependent build steps in separate jobs sharing cache). The GitHub cache
  # entries job 1 committed must be visible here on a cold runner.
  dependent-job-hit:
    name: Cross-job cache hit (GitHub backend)
    needs: double-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __fixtures__/turbo-monorepo
    steps:
      - uses: actions/checkout@v7
      # See the note in the double-build job: the action runs at the repo root,
      # so its own install is disabled and the fixture installs itself below.
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          install-deps: "false"
      - name: Assert the reported backend and port
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "github" ] || { echo "Expected backend 'github', got '$BACKEND'"; exit 1; }
          [ "$PORT" = "41230" ] || { echo "Expected port '41230', got '$PORT'"; exit 1; }
      - name: Install fixture dependencies
        run: pnpm install --frozen-lockfile
      - name: Build on a cold runner (must hit cache populated by the prior job)
        run: |
          OUT=$(pnpm exec turbo run build --remote-only)
          echo "$OUT"
          echo "$OUT" | grep -E ">>> FULL TURBO|cache hit" || { echo "Expected a cross-job remote cache hit"; exit 1; }

  # Job 3: the hosted cache, signed in to with this job's own OIDC token.
  #
  # The one job in this workflow that is granted `id-token: write`, and the
  # grant is what it tests: the action mints a token for the service's origin,
  # trades it for a cache token and points turbo at the service. No secret is
  # involved, so there is nothing to configure and nothing to gate on.
  #
  # Skipped on a pull request from a fork. GitHub issues a fork's run no OIDC
  # token whatever this file asks for, so the job could only ever exercise the
  # fallback there, and `hosted-fallback` below already does that on every run.
  # On `workflow_dispatch` there is no pull request and the condition is true.
  # Dependabot is skipped too: whether GitHub issues an OIDC token to a
  # Dependabot pull request run is unconfirmed, and the job must not fail the
  # suite for that.
  hosted-double-build:
    name: Hosted cache double build (OIDC sign-in)
    if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: __fixtures__/turbo-monorepo
    steps:
      - uses: actions/checkout@v7
      # A file inside the package, so it is part of the build's task hash: no
      # earlier run can have put this hash in the service, so the first build
      # has to upload it and the second can only hit what the first wrote.
      - name: Make this run's build hash unique
        env:
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: printf '%s' "$NONCE" > packages/app/nonce.txt
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          install-deps: "false"
          turbo-api: https://cache.savvyweb.systems
      # A hosted cache is not a local server: a backend, no port, and the
      # service's own URL where the embedded server's loopback address would be.
      # The token is never printed; only that one was exported.
      - name: Assert the job signed in and turbo is pointed at the service
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "hosted" ] || { echo "Expected backend 'hosted', got '$BACKEND'"; exit 1; }
          [ -z "$PORT" ] || { echo "Expected no port, got '$PORT'"; exit 1; }
          [ "$TURBO_API" = "https://cache.savvyweb.systems" ] || { echo "Unexpected TURBO_API '$TURBO_API'"; exit 1; }
          [ "$TURBO_TEAM" = "silk" ] || { echo "Expected TURBO_TEAM 'silk', got '$TURBO_TEAM'"; exit 1; }
          [ -n "$TURBO_TOKEN" ] || { echo "TURBO_TOKEN was not exported"; exit 1; }
      - name: Install fixture dependencies
        run: pnpm install --frozen-lockfile
      - name: First build (populates the hosted cache)
        run: pnpm exec turbo run build --remote-only
      - name: Clear local turbo state
        run: rm -rf .turbo packages/app/.turbo node_modules/.cache/turbo
      - name: Second build (must be a hosted cache hit)
        run: |
          OUT=$(pnpm exec turbo run build --remote-only)
          echo "$OUT"
          echo "$OUT" | grep -E ">>> FULL TURBO|cache hit" || { echo "Expected a hosted cache hit"; exit 1; }

  # Job 4: the same input with no `id-token` grant. The runner publishes no
  # token service, sign-in fails with `oidc: unavailable`, and the action has
  # to warn, start the embedded server and let the job pass: a `turbo-api` a
  # job cannot use must cost it nothing. This is what every job in a workflow
  # without the grant gets, and what a fork's pull request gets everywhere.
  hosted-fallback:
    name: Hosted cache falls back without id-token
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __fixtures__/turbo-monorepo
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          install-deps: "false"
          turbo-api: https://cache.savvyweb.systems
      - name: Assert the embedded server took over
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "github" ] || { echo "Expected backend 'github', got '$BACKEND'"; exit 1; }
          [ "$PORT" = "41230" ] || { echo "Expected port '41230', got '$PORT'"; exit 1; }
          [ "$TURBO_API" = "http://127.0.0.1:41230" ] || { echo "Unexpected TURBO_API '$TURBO_API'"; exit 1; }
      - name: Install fixture dependencies
        run: pnpm install --frozen-lockfile
      - name: First build (populates the embedded cache)
        run: pnpm exec turbo run build --remote-only
      - name: Clear local turbo state
        run: rm -rf .turbo packages/app/.turbo node_modules/.cache/turbo
      - name: Second build (must be an embedded cache hit)
        run: |
          OUT=$(pnpm exec turbo run build --remote-only)
          echo "$OUT"
          echo "$OUT" | grep -E ">>> FULL TURBO|cache hit" || { echo "Expected a remote cache hit"; exit 1; }

  # Job 5: the install's own lifecycle scripts reach the remote cache.
  #
  # Every job above passes `install-deps: false` and builds from a later step,
  # so none of them runs turbo *inside* the action's install — the one place
  # where the exported TURBO_* variables do not reach, because `GITHUB_ENV` is
  # read between steps and a `prepare` script is a child of this one. The action
  # starts the cache ahead of the install and hands the install child the
  # variables directly; when that regresses nothing fails, installs just get
  # slow, which is why it needs a job of its own.
  #
  # The fixture is moved to the workspace root because a `uses:` step ignores
  # `working-directory`, and here the action's install is the thing under test.
  prepare-script-build:
    name: Prepare-script build during install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Move the fixture to the workspace root
        shell: python
        env:
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        run: |
          import os
          import shutil
          from pathlib import Path

          keep = {".github", ".git", "__fixtures__"}
          for item in Path(".").iterdir():
              if item.name in keep:
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in (Path("__fixtures__") / "turbo-prepare").iterdir():
              if item.is_dir():
                  shutil.copytree(item, item.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, item.name)
          shutil.rmtree("__fixtures__")
          # A file inside the package, so it is part of the build's task hash:
          # no earlier run can have put this hash in the remote cache, and the
          # only build that can upload it before the assertion below is the one
          # the `prepare` script runs during the install.
          Path("packages/app/nonce.txt").write_text(os.environ["NONCE"])
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          cache-bust: prepare-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert the reported backend and port
        shell: bash
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "github" ] || { echo "Expected backend 'github', got '$BACKEND'"; exit 1; }
          [ "$PORT" = "41230" ] || { echo "Expected port '41230', got '$PORT'"; exit 1; }
      - name: Assert the prepare script saw the remote cache environment
        shell: bash
        run: |
          [ -f turbo-prepare-env.json ] || { echo "The prepare script did not run during the install"; exit 1; }
          cat turbo-prepare-env.json; echo
          EXPECTED='{"TURBO_API":"http://127.0.0.1:41230","TURBO_TOKEN":true,"TURBO_TEAM":true}'
          [ "$(cat turbo-prepare-env.json)" = "$EXPECTED" ] || { echo "Expected $EXPECTED"; exit 1; }
      - name: Clear local turbo state and the build output
        shell: bash
        run: rm -rf .turbo packages/app/.turbo node_modules/.cache/turbo packages/app/dist
      - name: Build again (must hit what the prepare script uploaded)
        shell: bash
        run: |
          OUT=$(pnpm exec turbo run build --remote-only)
          echo "$OUT"
          echo "$OUT" | grep -E ">>> FULL TURBO|cache hit" || { echo "Expected a remote hit on the artifact the prepare build uploaded"; exit 1; }

  # Job 6: the other side of job 5. With `ignore-scripts` nothing during the
  # install can use the cache, so the action keeps the late start — which this
  # cannot observe — but the cache must still come up for the steps after it.
  ignore-scripts-install:
    name: Install with ignore-scripts still starts the cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the fixture to the workspace root
        shell: python
        run: |
          import shutil
          from pathlib import Path

          keep = {".github", ".git", "__fixtures__"}
          for item in Path(".").iterdir():
              if item.name in keep:
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in (Path("__fixtures__") / "turbo-prepare").iterdir():
              if item.is_dir():
                  shutil.copytree(item, item.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, item.name)
          shutil.rmtree("__fixtures__")
      - uses: ./.github/actions/local
        id: setup
        with:
          turbo-cache: auto
          ignore-scripts: "true"
          cache-bust: ignore-scripts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert the cache started and no lifecycle script ran
        env:
          BACKEND: ${{ steps.setup.outputs.turbo-cache-backend }}
          PORT: ${{ steps.setup.outputs.turbo-cache-port }}
        run: |
          [ "$BACKEND" = "github" ] || { echo "Expected backend 'github', got '$BACKEND'"; exit 1; }
          [ "$PORT" = "41230" ] || { echo "Expected port '41230', got '$PORT'"; exit 1; }
          [ ! -e turbo-prepare-env.json ] || { echo "A lifecycle script ran despite ignore-scripts"; exit 1; }
          [ -n "$TURBO_API" ] || { echo "TURBO_API was not exported for later steps"; exit 1; }
